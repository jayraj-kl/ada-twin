nt-order="stroke">$10k–$50k once + $130k–$210k/yr · $1.6k per extra part/shift</text><rect x="470" y="226" width="133.70000000000002" height="26" rx="4" fill="#FB8C3B" fill-opacity="1"/><text x="615.7" y="245" font-size="17" fill="#C2410C" font-weight="700" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+19.1 parts</text><text x="40" y="320" font-size="17" fill="#2A2622" font-weight="600" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Double Header queue to 12 parts</text><text x="40" y="342" font-size="13" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">$1k–$6k once</text><rect x="464.4" y="302" width="5.6000000000000005" height="26" rx="4" fill="#E4DCD2" fill-opacity="1"/><text x="482" y="321" font-size="17" fill="#7A726B" font-weight="700" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−0.8 parts</text><line x1="470" x2="470" y1="60" y2="350" stroke="#7A726B" stroke-width="1"/><text x="40" y="386" font-size="13" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gain = average over the same 30 seeds, standard rules. Costs: Gemini web search, USD.</text>

<text x="40" y="96" font-size="64" fill="#C2410C" font-weight="500" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">11.4M×</text><text x="40" y="140" font-size="16" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">faster than real time (8-h shift in 2.53 ms)</text><line x1="395" x2="395" y1="20" y2="180" stroke="#E4DCD2"/><text x="419" y="96" font-size="64" fill="#C2410C" font-weight="500" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.08 s</text><text x="419" y="140" font-size="16" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">for a 30-day average, on a laptop</text><line x1="750" x2="750" y1="20" y2="180" stroke="#E4DCD2"/><text x="774" y="96" font-size="64" fill="#C2410C" font-weight="500" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30/30</text><text x="774" y="140" font-size="16" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gemini decisions, none fell back</text><line x1="1105" x2="1105" y1="20" y2="180" stroke="#E4DCD2"/><text x="1129" y="96" font-size="64" fill="#C2410C" font-weight="500" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">150/150</text><text x="1129" y="140" font-size="16" fill="#7A726B" font-weight="400" text-anchor="start" stroke="#FFFDFA" stroke-width="5" stroke-linejoin="round" paint-order="stroke">automated tests passing</text>
